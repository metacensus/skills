name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Not --strict: its one warning is the absent version, absent so every commit is a release.
      - name: Validate the plugin and marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Check the elegance skill and the twins
        run: node scripts/check-cells.mts
      - name: Check markdown prose is one line per paragraph
        run: node scripts/check-md.mts --check
      - name: Scan the whole history for secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git

name: Spike
description: A question to settle before the work that depends on it — Task-sized. Its deliverable is a decision, not a diff.
title: "Spike: "
labels: ["needs-triage"]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `issues` skill](https://github.com/metacensus/skills/blob/main/skills/issues/SKILL.md).

        Done is a decision written where the work reads it — usually the parent's body — and a closing comment beginning `Decision:`. Attach this to its parent after filing (`gh issue edit THIS --parent EPIC`).

  - type: textarea
    id: question
    attributes:
      label: Question
      description: One sentence, answerable.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: What the answer chooses between, and the evidence that would decide.
      placeholder: |
        - …
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Optional — a command that demonstrates the evidence.
      render: shell

name: Epic
description: Weeks of work, held as Tasks. Jira's Epic.
labels: ["needs-triage"]
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `issues` skill](https://github.com/metacensus/skills/blob/main/skills/issues/SKILL.md).

        An Epic is judged by whether its children can finish without reaching back up. Children are the **linked sub-issues** (`gh issue edit N --parent THIS`), not a list in the body.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence — what is true when every child has closed.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What is out of scope, so creep across children is visible.
      placeholder: |
        - …
    validations:
      required: true

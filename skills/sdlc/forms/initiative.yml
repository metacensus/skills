name: Initiative
description: Quarter-scale, held as Epics.
type: Initiative
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `sdlc` skill](https://github.com/metacensus/skills/blob/main/skills/sdlc/SKILL.md).

        Children are Epics, attached as sub-issues (`gh issue edit EPIC --parent THIS`), not a list in the body.

  - type: input
    id: roadmap
    attributes:
      label: Roadmap
      description: Link to the roadmap entry that owns this Initiative's narrative.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph — what is true when every Epic has closed.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
    validations:
      required: true

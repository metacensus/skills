name: Initiative
description: Quarter-scale, held as Epics.
type: Initiative
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `sdlc` skill](https://github.com/metacensus/skills/blob/main/skills/sdlc/SKILL.md).

        Children are sub-issues (`gh issue edit N --parent THIS`), not a list in the body.

  - type: input
    id: roadmap
    attributes:
      label: Roadmap
      description: The roadmap entry that owns its narrative.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph — what is true when every Epic has closed.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
    validations:
      required: true

  - type: textarea
    id: decided
    attributes:
      label: Decided
      description: Choices not to reopen, one line each.
    validations:
      required: true

  - type: textarea
    id: stops
    attributes:
      label: Stops
      description: "What always waits on a person: named Spikes, hands-on steps, publishing, merges."
    validations:
      required: true

  - type: textarea
    id: owed
    attributes:
      label: Owed
      description: Steps the finish line needs that no Epic holds.
    validations:
      required: true

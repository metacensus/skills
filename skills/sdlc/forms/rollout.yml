name: Rollout
description: Releases with time and conditions between them, held as sub-issues.
type: Rollout
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `sdlc` skill](https://github.com/metacensus/skills/blob/main/skills/sdlc/SKILL.md).

        Its Releases are sub-issues (`gh issue edit RELEASE --parent THIS`), each blocked by exactly the earlier Release or gate Task it needs; it takes no parent. Its plan lives in the body.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence — the end state once every Release is live.
    validations:
      required: true

  - type: textarea
    id: conditions
    attributes:
      label: Conditions
      description: What must hold on the live system between its Releases, each a threshold over a window or a soak; work done first is a gate Task its Release is blocked by.
    validations:
      required: true

  - type: input
    id: exposure
    attributes:
      label: Exposure
      description: Who a fault reaches, such as greenfield, live users or regulated; every gate is sized to it.
    validations:
      required: true

name: Release
description: "One cohesive change to production: its Publishes, held as sub-issues, plus deploys."
type: Release
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `sdlc` skill](https://github.com/metacensus/skills/blob/main/skills/sdlc/SKILL.md).

        Its Publishes are sub-issues (`gh issue edit PUBLISH --parent THIS`); its parent, if any, is a Rollout. A change whose parts need time or a condition between them is a Rollout.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence — what is live once it closes.
    validations:
      required: true

  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Observable claims about production, each one `live-check` can confirm, and an optional soak window.
      placeholder: |
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: deploys
    attributes:
      label: Deploys
      description: Each environment it changes and the desired state that changes it, a Terraform root's apply as a Publish; none for a library or plugin.

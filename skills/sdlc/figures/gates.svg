<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" class="ink">
  <title>Gates mirrored around the work</title>
  <style>
    .bg { fill: var(--bg, #fff) }
    .ink { fill: var(--ink, #444A5A) }
    .soft { fill: var(--ink, #444A5A); fill-opacity: .8 }
    .muted { fill: var(--muted, #8A90A2) }
    .accent { fill: var(--accent, #3B0E75) }
    .edge { fill: none; stroke: var(--ink, #444A5A) }
    .back { fill: none; stroke: var(--muted, #8A90A2) }
    .mirror { fill: none; stroke: var(--accent, #3B0E75) }
    .blue { fill: var(--azure, #3D9BD1); fill-opacity: .18; stroke: var(--azure, #3D9BD1) }
  </style>
  <defs>
    <marker id="then" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ink"/></marker>
    <marker id="back" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="muted"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" class="bg"/>

  <g class="blue">
    <rect x="16" y="16" width="128" height="128" rx="8"/>
    <rect x="176" y="16" width="128" height="128" rx="8"/>
    <rect x="336" y="16" width="128" height="128" rx="8"/>
    <rect x="496" y="16" width="128" height="128" rx="8"/>
    <rect x="656" y="16" width="128" height="128" rx="8"/>
  </g>
  <g class="blue">
    <line x1="32" y1="96" x2="128" y2="96"/>
    <line x1="192" y1="96" x2="288" y2="96"/>
    <line x1="352" y1="96" x2="448" y2="96"/>
    <line x1="512" y1="96" x2="608" y2="96"/>
    <line x1="672" y1="96" x2="768" y2="96"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <g font-size="14" font-weight="600">
      <text x="80" y="40">Frame</text>
      <text x="240" y="40">Design</text>
      <text x="400" y="40">Work</text>
      <text x="560" y="40">Review</text>
      <text x="720" y="40">Accept</text>
    </g>
    <g class="soft">
      <text x="80" y="64">delegator, via</text>
      <text x="80" y="80">sdlc-intake</text>
      <text x="240" y="72">the carrier</text>
      <text x="400" y="72">the carrier</text>
      <text x="560" y="72">reviewer</text>
      <text x="720" y="64">delegator,</text>
      <text x="720" y="80">not the carrier</text>
    </g>
    <text x="80" y="120">ready</text>
    <text x="240" y="112">designed, applied</text>
    <text x="240" y="128">by the delegator</text>
    <text x="400" y="112">a PR, or the</text>
    <text x="400" y="128">children closed</text>
    <text x="560" y="112">the verdict,</text>
    <text x="560" y="128">and deviated</text>
    <text x="720" y="112">the close kept</text>
    <text x="720" y="128">or reopened</text>
  </g>

  <g class="edge" stroke-width="1.5">
    <line x1="144" y1="40" x2="176" y2="40" marker-end="url(#then)"/>
    <line x1="304" y1="40" x2="336" y2="40" marker-end="url(#then)"/>
    <line x1="464" y1="40" x2="496" y2="40" marker-end="url(#then)"/>
    <line x1="624" y1="40" x2="656" y2="40" marker-end="url(#then)"/>
  </g>
  <g class="soft" text-anchor="middle" dominant-baseline="central">
    <text x="160" y="96" transform="rotate(-90 160 96)">the issue</text>
    <text x="320" y="96" transform="rotate(-90 320 96)">the Design</text>
    <text x="480" y="96" transform="rotate(-90 480 96)">the PR</text>
    <text x="640" y="96" transform="rotate(-90 640 96)">the merge</text>
  </g>

  <g class="back" stroke-width="1.5">
    <polyline points="528,144 528,176 432,176 432,144" marker-end="url(#back)"/>
    <polyline points="688,144 688,208 272,208 272,144" marker-end="url(#back)"/>
  </g>
  <g class="soft" text-anchor="middle" dominant-baseline="central">
    <text x="480" y="160">a finding</text>
    <text x="480" y="224">a miss reopens the issue</text>
  </g>

  <g class="mirror" stroke-width="2">
    <polyline points="240,240 240,256 560,256 560,240"/>
    <polyline points="80,304 80,320 720,320 720,304"/>
  </g>
  <g class="accent" text-anchor="middle" dominant-baseline="central">
    <text x="240" y="272">how</text>
    <text x="560" y="272">did we do what we said</text>
    <text x="80" y="336">what should we do</text>
    <text x="720" y="336">did we achieve it</text>
  </g>

  <g dominant-baseline="central">
    <text x="16" y="376"><tspan font-weight="600">step</tspan> · <tspan class="soft">owner</tspan> · closed by</text>
    <line x1="184" y1="376" x2="216" y2="376" class="edge" stroke-width="1.5" marker-end="url(#then)"/>
    <text x="224" y="376">then, handing on</text>
    <line x1="376" y1="376" x2="344" y2="376" class="back" stroke-width="1.5" marker-end="url(#back)"/>
    <text x="384" y="376">sometimes back</text>
    <polyline points="496,368 496,384 528,384 528,368" class="mirror" stroke-width="2"/>
    <text x="536" y="376">mirrored gates and their questions</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" class="ink">
  <title>Issue types and their edges</title>
  <desc>Code changes, Initiative over Epic over Task and Bug, and production changes, Rollout over Release over Publish; a Publish is blocked by the Epic it ships, and a consumer's Task by the Publish it adopts.</desc>
  <style>
    svg { --bg: #fff; --ink: #444A5A; --muted: #8A90A2; --azure: #3D9BD1 }
    @media (prefers-color-scheme: dark) { svg { --bg: #121318; --ink: #E8E8EC } }
    .bg { fill: var(--bg) }
    .ink { fill: var(--ink) }
    .soft { fill: var(--ink); fill-opacity: .8 }
    .edge { fill: none; stroke: var(--ink) }
    .panel { fill: var(--ink); fill-opacity: .05; stroke: var(--muted); stroke-opacity: .5 }
    .blue { fill: var(--azure); fill-opacity: .18; stroke: var(--azure) }
    .group { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px }
    .muted { fill: var(--muted) }
  </style>
  <defs>
    <marker id="next" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ink"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" class="bg"/>

  <g class="panel">
    <rect x="24" y="16" width="352" height="304" rx="8"/>
    <rect x="456" y="16" width="320" height="304" rx="8"/>
    <rect x="24" y="368" width="752" height="96" rx="8"/>
  </g>
  <g font-size="12" dominant-baseline="central">
    <text x="40" y="32" class="group">CODE CHANGES</text>
    <text x="40" y="48" class="soft">an Initiative holds Epics; an Epic holds Tasks and Bugs</text>
    <text x="472" y="32" class="group">PRODUCTION CHANGES</text>
    <text x="472" y="48" class="soft">Rollout holds Releases; a Release holds Publishes</text>
    <text x="40" y="384" class="group">KEY</text>
  </g>

  <g class="blue">
    <rect x="248" y="64" width="112" height="48" rx="8"/>
    <rect x="248" y="160" width="112" height="48" rx="8"/>
    <rect x="104" y="256" width="112" height="48" rx="8"/>
    <rect x="248" y="256" width="112" height="48" rx="8"/>
    <rect x="472" y="64" width="112" height="48" rx="8"/>
    <rect x="472" y="160" width="112" height="48" rx="8"/>
    <rect x="472" y="256" width="112" height="48" rx="8"/>
  </g>
  <g font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <text x="304" y="88">Initiative</text>
    <text x="304" y="184">Epic</text>
    <text x="160" y="280">Bug</text>
    <text x="304" y="280">Task</text>
    <text x="528" y="88">Rollout</text>
    <text x="528" y="184">Release</text>
    <text x="528" y="280">Publish</text>
  </g>

  <g class="edge" stroke-width="1.5">
    <line x1="304" y1="160" x2="304" y2="112" marker-end="url(#next)"/>
    <line x1="304" y1="256" x2="304" y2="208" marker-end="url(#next)"/>
    <path d="M160,256 C160,208 280,256 280,208" marker-end="url(#next)"/>
    <line x1="528" y1="160" x2="528" y2="112" marker-end="url(#next)"/>
    <line x1="528" y1="256" x2="528" y2="208" marker-end="url(#next)"/>
  </g>
  <g class="edge" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M472,272 C416,272 416,184 360,184" marker-end="url(#next)"/>
    <line x1="360" y1="288" x2="472" y2="288" marker-end="url(#next)"/>
  </g>
  <g class="soft" text-anchor="middle" dominant-baseline="central">
    <text x="432" y="200">ships</text>
    <text x="416" y="304">adopts</text>
  </g>

  <text x="40" y="344" font-size="11" dominant-baseline="central" class="muted">ships: an Epic by default, its Tasks where they ship apart</text>

  <!-- key -->
  <rect x="40" y="408" width="32" height="16" rx="4" class="blue"/>
  <rect x="40" y="432" width="32" height="16" rx="4" class="panel"/>
  <line x1="424" y1="416" x2="456" y2="416" class="edge" stroke-width="1.5" marker-end="url(#next)"/>
  <line x1="424" y1="440" x2="456" y2="440" class="edge" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#next)"/>
  <g dominant-baseline="central">
    <text x="88" y="416">an issue type</text>
    <text x="88" y="440">a group</text>
    <text x="472" y="416">child → parent</text>
    <text x="472" y="440">blocked → blocker</text>
  </g>
</svg>

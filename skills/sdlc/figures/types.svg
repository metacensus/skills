<svg xmlns="http://www.w3.org/2000/svg" width="800" height="496" viewBox="0 0 800 496" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" class="ink">
  <title>Issue types and their edges</title>
  <style>
    .bg { fill: var(--bg, #fff) }
    .ink { fill: var(--ink, #444A5A) }
    .soft { fill: var(--ink, #444A5A); fill-opacity: .8 }
    .muted { fill: var(--muted, #8A90A2) }
    .edge { fill: none; stroke: var(--ink, #444A5A) }
    .rule { fill: none; stroke: var(--muted, #8A90A2) }
    .panel { fill: var(--ink, #444A5A); fill-opacity: .05; stroke: var(--muted, #8A90A2); stroke-opacity: .5 }
    .outside { fill: var(--bg, #fff); stroke: var(--muted, #8A90A2) }
    .blue { fill: var(--azure, #3D9BD1); fill-opacity: .18; stroke: var(--azure, #3D9BD1) }
    .purple { fill: var(--amethyst, #915EDA); fill-opacity: .18; stroke: var(--amethyst, #915EDA) }
  </style>
  <defs>
    <marker id="parent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ink"/></marker>
    <marker id="blocked" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="muted"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="496" class="bg"/>

  <rect x="16" y="112" width="448" height="296" rx="8" class="panel"/>
  <text x="448" y="128" text-anchor="end" dominant-baseline="central" font-size="12" class="soft">work, any tier</text>

  <rect x="16" y="16" width="192" height="48" rx="8" class="outside" stroke-dasharray="4 4"/>
  <text x="112" y="40" text-anchor="middle" dominant-baseline="central" class="soft">another Initiative's work</text>

  <g class="blue">
    <rect x="176" y="144" width="128" height="48" rx="8"/>
    <rect x="176" y="240" width="128" height="48" rx="8"/>
    <rect x="32" y="336" width="128" height="48" rx="8"/>
    <rect x="176" y="336" width="128" height="48" rx="8"/>
    <rect x="320" y="336" width="128" height="48" rx="8"/>
  </g>
  <g class="purple">
    <rect x="656" y="240" width="128" height="48" rx="8"/>
    <rect x="656" y="336" width="128" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="240" y="168">Initiative</text>
    <text x="240" y="264">Epic</text>
    <text x="96" y="360">Task</text>
    <text x="240" y="360">Spike (a Task)</text>
    <text x="384" y="360">Bug</text>
    <text x="720" y="264">Rollout</text>
    <text x="720" y="360">Release</text>
  </g>

  <g class="edge" stroke-width="1.5">
    <line x1="240" y1="240" x2="240" y2="192" marker-end="url(#parent)"/>
    <line x1="240" y1="336" x2="240" y2="288" marker-end="url(#parent)"/>
    <line x1="96" y1="336" x2="96" y2="312"/>
    <line x1="384" y1="336" x2="384" y2="312"/>
    <line x1="96" y1="312" x2="384" y2="312"/>
    <line x1="720" y1="336" x2="720" y2="288" marker-end="url(#parent)"/>
  </g>

  <g class="rule" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="112" y1="64" x2="112" y2="112" marker-end="url(#blocked)"/>
    <line x1="464" y1="264" x2="656" y2="264" marker-end="url(#blocked)"/>
    <line x1="656" y1="352" x2="464" y2="352" marker-end="url(#blocked)"/>
    <line x1="464" y1="368" x2="656" y2="368" marker-end="url(#blocked)"/>
  </g>
  <g font-size="12" class="soft" dominant-baseline="central">
    <text x="120" y="88">shared work</text>
    <text x="560" y="248" text-anchor="middle">follows, across repositories</text>
    <text x="560" y="336" text-anchor="middle">ships</text>
    <text x="560" y="384" text-anchor="middle">follows</text>
  </g>

  <g font-size="12" dominant-baseline="central">
    <rect x="16" y="440" width="24" height="16" rx="4" class="blue"/>
    <text x="48" y="448">work type</text>
    <rect x="144" y="440" width="24" height="16" rx="4" class="purple"/>
    <text x="176" y="448">release type</text>
    <rect x="288" y="440" width="24" height="16" rx="4" class="outside" stroke-dasharray="4 4"/>
    <text x="320" y="448">outside this Initiative</text>
    <line x1="16" y1="472" x2="40" y2="472" class="edge" stroke-width="1.5" marker-end="url(#parent)"/>
    <text x="48" y="472">parent: child → parent</text>
    <line x1="208" y1="472" x2="232" y2="472" class="rule" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#blocked)"/>
    <text x="240" y="472">blocked by: blocked → blocker</text>
  </g>
</svg>

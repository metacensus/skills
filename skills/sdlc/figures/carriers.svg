    <g class="soft">
      <text x="216" y="1104">merge ends Work; release is a Production change</text>
      <text x="584" y="1104">runs at any tier while a step waits on a person</text>
      <text x="216" y="1160">shapes all a person reads; no one step owns it</text>
      <text x="584" y="1160">the bar for every step's writing, not one step</text>
      <text x="216" y="1216">gates every public write; its agents sit in Work</text>
      <text x="584" y="1216">a PR per repository; no tier's issue carries it</text>
      <text x="216" y="1272">reads a PR with a person; no step is theirs</text>
      <text x="584" y="1272">after merge, before live: past Accept</text>

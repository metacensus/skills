    <line x1="128" y1="392" x2="192" y2="392" marker-end="url(#next)"/>
    <line x1="288" y1="392" x2="352" y2="392" marker-end="url(#next)"/>
    <line x1="448" y1="392" x2="512" y2="392" marker-end="url(#next)"/>
    <line x1="608" y1="392" x2="672" y2="392" marker-end="url(#next)"/>
  </g>
  <g class="soft" text-anchor="middle" dominant-baseline="central">
    <text x="400" y="144">Work: each Epic's whole lifecycle</text>
    <text x="400" y="304">Work: each Task's or Bug's whole lifecycle</text>

    <rect x="344" y="480" width="112" height="48" rx="8"/>
    <rect x="496" y="480" width="112" height="48" rx="8" class="cold"/>
    <rect x="648" y="480" width="112" height="48" rx="8"/>
    <rect x="192" y="144" width="112" height="32" rx="8" class="cold"/>
    <rect x="192" y="344" width="112" height="32" rx="8" class="cold"/>
    <rect x="280" y="544" width="112" height="32" rx="8" class="cold"/>
    <rect x="408" y="544" width="112" height="32" rx="8" class="cold"/>
  </g>

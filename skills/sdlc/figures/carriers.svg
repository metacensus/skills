    <rect x="192" y="48" width="96" height="48" rx="8"/>
    <rect x="352" y="48" width="96" height="48" rx="8"/>
    <rect x="512" y="48" width="96" height="48" rx="8"/>
    <rect x="672" y="48" width="96" height="48" rx="8"/>
    <rect x="32" y="208" width="96" height="48" rx="8"/>
    <rect x="192" y="208" width="96" height="48" rx="8"/>
    <rect x="352" y="208" width="96" height="48" rx="8"/>
    <rect x="512" y="208" width="96" height="48" rx="8"/>
    <rect x="672" y="208" width="96" height="48" rx="8"/>
    <rect x="32" y="368" width="96" height="48" rx="8"/>
    <rect x="192" y="368" width="96" height="48" rx="8"/>
    <rect x="352" y="368" width="96" height="48" rx="8"/>
    <rect x="512" y="368" width="96" height="48" rx="8"/>
    <rect x="672" y="368" width="96" height="48" rx="8"/>

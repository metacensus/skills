<svg xmlns="http://www.w3.org/2000/svg" width="800" height="592" viewBox="0 0 800 592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <title>Who carries each tier, stages by phase</title>
  <defs>
    <marker id="spawn" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2328"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="592" fill="#ffffff"/>

  <g font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <text x="80" y="24" fill="#59636e" font-weight="400" font-size="12">tier · carrier</text>
    <text x="232" y="24">Design</text>
    <text x="392" y="24">Delivery</text>
    <text x="552" y="24">Record</text>
  </g>

  <g fill="#f6f8fa" stroke="#d1d9e0">
    <rect x="16" y="48" width="128" height="64" rx="8"/>
    <rect x="16" y="160" width="128" height="64" rx="8"/>
    <rect x="16" y="272" width="128" height="64" rx="8"/>
    <rect x="16" y="384" width="128" height="64" rx="8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="80" y="72" font-size="13" font-weight="600">Frame, all tiers</text>
    <text x="80" y="88" fill="#8250df">sdlc-intake</text>
    <text x="80" y="184" font-size="13" font-weight="600">Initiative</text>
    <text x="80" y="200" fill="#8250df">sdlc-fleet</text>
    <text x="80" y="296" font-size="13" font-weight="600">Epic</text>
    <text x="80" y="312" fill="#8250df">sdlc-crew</text>
    <text x="80" y="408" font-size="13" font-weight="600">Task, Bug</text>
    <text x="80" y="424" fill="#8250df">sdlc-author</text>
  </g>

  <g fill="#ddf4ff" stroke="#54aeff">
    <rect x="160" y="48" width="144" height="64" rx="8"/>
    <rect x="160" y="160" width="144" height="64" rx="8"/>
    <rect x="320" y="160" width="144" height="64" rx="8"/>
    <rect x="480" y="160" width="144" height="64" rx="8"/>
    <rect x="160" y="272" width="144" height="64" rx="8"/>
    <rect x="320" y="272" width="144" height="64" rx="8"/>
    <rect x="480" y="272" width="144" height="64" rx="8"/>
    <rect x="160" y="384" width="144" height="64" rx="8"/>
    <rect x="320" y="384" width="144" height="64" rx="8"/>
    <rect x="480" y="384" width="144" height="64" rx="8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="232" y="64">Compose ·</text>
    <text x="232" y="80">Decompose ·</text>
    <text x="232" y="96">File · Curate</text>
    <text x="392" y="80" font-size="24" fill="#8c959f">·</text>
    <text x="552" y="80" font-size="24" fill="#8c959f">·</text>

    <text x="232" y="192">Precheck · Design</text>
    <text x="392" y="192">Plan · Delegate</text>
    <text x="552" y="192">Close</text>

    <text x="232" y="304">Precheck · Design</text>
    <text x="392" y="296">Plan · Delegate ·</text>
    <text x="392" y="312">Review · Land</text>
    <text x="552" y="304">Close</text>

    <text x="232" y="416">Precheck · Design</text>
    <text x="392" y="400">Implement ·</text>
    <text x="392" y="416">Self-review ·</text>
    <text x="392" y="432">Publish · Respond</text>
    <text x="552" y="416">Land</text>
  </g>

  <g stroke="#1f2328" stroke-width="1.5" fill="none">
    <polyline points="392,224 392,256 80,256 80,272" marker-end="url(#spawn)"/>
    <polyline points="392,336 392,368 80,368 80,384" marker-end="url(#spawn)"/>
  </g>
  <g fill="#59636e" text-anchor="middle" dominant-baseline="central">
    <text x="240" y="240">a crew per Epic</text>
    <text x="240" y="352">an author per child</text>
  </g>

  <g stroke="#8c959f" fill="none">
    <polyline points="640,48 648,48 648,448 640,448"/>
    <line x1="648" y1="248" x2="672" y2="248"/>
    <line x1="392" y1="448" x2="392" y2="480" stroke-dasharray="2 2"/>
  </g>
  <g fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 4">
    <rect x="672" y="224" width="112" height="48" rx="8"/>
    <rect x="336" y="480" width="112" height="48" rx="8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="728" y="248" fill="#8250df">sdlc-hygiene</text>
    <text x="392" y="504" fill="#8250df">sdlc-review</text>
  </g>

  <g dominant-baseline="central">
    <rect x="16" y="560" width="24" height="16" rx="4" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="48" y="568">tier and its carrier</text>
    <rect x="208" y="560" width="24" height="16" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="240" y="568">stages, in order</text>
    <rect x="384" y="560" width="24" height="16" rx="4" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 4"/>
    <text x="416" y="568">drift check, on its own trigger</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="448" viewBox="0 0 800 448" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" class="ink">
  <title>Each tier's carrier runs the steps; its Work holds the tier below</title>
  <style>
    .bg { fill: var(--bg, #fff) }
    .ink { fill: var(--ink, #444A5A) }
    .soft { fill: var(--ink, #444A5A); fill-opacity: .8 }
    .accent { fill: var(--accent, #3B0E75) }
    .edge { fill: none; stroke: var(--ink, #444A5A) }
    .panel { fill: var(--ink, #444A5A); fill-opacity: .05; stroke: var(--muted, #8A90A2); stroke-opacity: .5 }
    .blue { fill: var(--azure, #3D9BD1); fill-opacity: .18; stroke: var(--azure, #3D9BD1) }
    .funnel { fill: var(--azure, #3D9BD1); fill-opacity: .08; stroke: var(--azure, #3D9BD1); stroke-opacity: .5 }
  </style>
  <defs>
    <marker id="next" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ink"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="448" class="bg"/>

  <g class="panel">
    <rect x="16" y="16" width="768" height="96" rx="8"/>
    <rect x="16" y="176" width="768" height="96" rx="8"/>
    <rect x="16" y="336" width="768" height="96" rx="8"/>
  </g>
  <g class="funnel">
    <polygon points="352,96 448,96 776,176 24,176"/>
    <polygon points="352,256 448,256 776,336 24,336"/>
  </g>
  <g font-size="13" dominant-baseline="central">
    <text x="32" y="32"><tspan font-weight="600" class="accent">sdlc-fleet</tspan><tspan class="soft"> · Initiative</tspan></text>
    <text x="32" y="192"><tspan font-weight="600" class="accent">sdlc-crew</tspan><tspan class="soft"> · Epic</tspan></text>
    <text x="32" y="352"><tspan font-weight="600" class="accent">sdlc-author</tspan><tspan class="soft"> · Task, Bug</tspan></text>
  </g>
  <g class="blue">

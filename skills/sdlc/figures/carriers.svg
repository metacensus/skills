  <rect x="424" y="696" width="32" height="16" rx="4" class="card"/>
  <g dominant-baseline="central">
    <text x="440" y="704" text-anchor="middle" font-size="16" font-weight="600" class="soft">·</text>
    <text x="472" y="632">an agent's step</text>
    <text x="472" y="656">a person's step</text>
    <text x="472" y="680">a cold reviewer: a fresh context</text>
    <text x="472" y="704">no skill names who runs it</text>
  </g>

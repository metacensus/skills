    <text x="240" y="72">Design</text>
    <text x="400" y="72">Work</text>
    <text x="560" y="72">Review</text>
    <text x="720" y="72">Accept</text>
    <text x="80" y="232">Frame</text>
    <text x="240" y="232">Design</text>
    <text x="400" y="232">Work</text>
    <text x="560" y="232">Review</text>
    <text x="720" y="232">Accept</text>
    <text x="80" y="392">Frame</text>
    <text x="240" y="392">Design</text>
    <text x="400" y="392">Work</text>
    <text x="560" y="392">Review</text>
    <text x="720" y="392">Accept</text>
  </g>

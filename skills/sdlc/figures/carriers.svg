<svg xmlns="http://www.w3.org/2000/svg" width="800" height="752" viewBox="0 0 800 752" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" class="ink">
  <title>sdlc's parts: each tier a span its Work funnels into, who runs each step, its cold reviewers, and project management</title>
  <style>
    .bg { fill: var(--bg, #fff) }
    .ink { fill: var(--ink, #444A5A) }
    .soft { fill: var(--ink, #444A5A); fill-opacity: .8 }
    .accent { fill: var(--accent, #3B0E75) }
    .edge { fill: none; stroke: var(--ink, #444A5A) }
    .frame { fill: none; stroke: var(--accent, #3B0E75) }
    .panel { fill: var(--ink, #444A5A); fill-opacity: .05; stroke: var(--muted, #8A90A2); stroke-opacity: .5 }
    .blue { fill: var(--azure, #3D9BD1); fill-opacity: .18; stroke: var(--azure, #3D9BD1) }
    .purple { fill: var(--amethyst, #915EDA); fill-opacity: .18; stroke: var(--amethyst, #915EDA) }
    .card { fill: var(--bg, #fff); stroke: var(--muted, #8A90A2) }
    .cold { stroke-width: 1.5; stroke-dasharray: 4 3 }
    .tick { fill: none; stroke: var(--azure, #3D9BD1); stroke-width: 2 }
    .funnel { fill: var(--azure, #3D9BD1); fill-opacity: .08; stroke: var(--azure, #3D9BD1); stroke-opacity: .5 }
  </style>
  <defs>
    <marker id="next" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ink"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="752" class="bg"/>

  <rect x="8" y="8" width="784" height="736" rx="8" class="frame" stroke-width="1.5"/>
  <text x="24" y="32" font-size="13" dominant-baseline="central"><tspan font-weight="600" class="accent">sdlc</tspan><tspan class="soft"> · the hub: ladder, status, labels; the skills inside are its parts</tspan></text>

  <g class="panel">
    <rect x="24" y="48" width="752" height="136" rx="8"/>
    <rect x="24" y="248" width="752" height="136" rx="8"/>
    <rect x="24" y="448" width="752" height="136" rx="8"/>
    <rect x="24" y="608" width="368" height="120" rx="8"/>
    <rect x="408" y="608" width="368" height="120" rx="8"/>
  </g>
  <g class="funnel">
    <polygon points="344,128 456,128 456,184 776,248 24,248 344,184"/>
    <polygon points="344,328 456,328 456,384 776,448 24,448 344,384"/>
  </g>
  <g font-size="13" dominant-baseline="central">
    <text x="40" y="64"><tspan font-weight="600" class="accent">sdlc-fleet</tspan><tspan class="soft"> · Initiative, in a person's span</tspan></text>
    <text x="40" y="264"><tspan font-weight="600" class="accent">sdlc-crew</tspan><tspan class="soft"> · Epic, in the fleet's span</tspan></text>
    <text x="40" y="464"><tspan font-weight="600" class="accent">sdlc-author</tspan><tspan class="soft"> · Task, Bug, in the crew's span</tspan></text>
    <text x="40" y="624" font-weight="600" class="accent">Project management</text>
  </g>

  <g class="purple">
    <rect x="40" y="80" width="112" height="48" rx="8"/>
    <rect x="648" y="80" width="112" height="48" rx="8"/>
  </g>
  <g class="blue">

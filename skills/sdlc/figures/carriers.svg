    <line x1="288" y1="72" x2="352" y2="72" marker-end="url(#next)"/>
    <line x1="448" y1="72" x2="512" y2="72" marker-end="url(#next)"/>
    <line x1="608" y1="72" x2="672" y2="72" marker-end="url(#next)"/>

    <text x="96" y="96">Frame</text>
    <text x="248" y="96">Design</text>
    <text x="400" y="96">Work</text>
    <text x="552" y="96">Review</text>
    <text x="704" y="96">Accept</text>
    <text x="96" y="296">Frame</text>
    <text x="248" y="296">Design</text>
    <text x="400" y="296">Work</text>
    <text x="552" y="296">Review</text>
    <text x="704" y="296">Accept</text>
    <text x="96" y="496">Frame</text>
    <text x="248" y="496">Design</text>
    <text x="400" y="496">Work</text>
    <text x="552" y="496">Review</text>
    <text x="704" y="496">Accept</text>
  </g>
  <g class="soft" text-anchor="middle" dominant-baseline="central">
    <text x="96" y="112">person</text>
    <text x="248" y="112">fleet</text>
    <text x="400" y="112">fleet</text>
    <text x="552" y="112" font-size="16" font-weight="600">·</text>
    <text x="704" y="112">person</text>
    <text x="96" y="312">fleet or person</text>
    <text x="248" y="312">design crew</text>
    <text x="400" y="312">crew</text>
    <text x="552" y="312" font-size="16" font-weight="600">·</text>
    <text x="704" y="312">fleet</text>
    <text x="96" y="512">crew</text>
    <text x="248" y="512">design author</text>
    <text x="400" y="512">implement author</text>
    <text x="552" y="512">fresh reviewer</text>
    <text x="704" y="512">crew</text>
  </g>
  <g font-weight="600" text-anchor="middle" dominant-baseline="central" class="accent">
    <text x="248" y="160">sdlc-family</text>
    <text x="248" y="360">sdlc-family</text>
    <text x="336" y="560">elegance-review</text>
    <text x="464" y="560">open-source scan</text>
  </g>

  <g class="edge" stroke-width="1.5">
    <line x1="152" y1="104" x2="192" y2="104" marker-end="url(#next)"/>
    <line x1="304" y1="104" x2="344" y2="104" marker-end="url(#next)"/>
    <line x1="456" y1="104" x2="496" y2="104" marker-end="url(#next)"/>
    <line x1="608" y1="104" x2="648" y2="104" marker-end="url(#next)"/>
    <line x1="152" y1="304" x2="192" y2="304" marker-end="url(#next)"/>
    <line x1="304" y1="304" x2="344" y2="304" marker-end="url(#next)"/>
    <line x1="456" y1="304" x2="496" y2="304" marker-end="url(#next)"/>
    <line x1="608" y1="304" x2="648" y2="304" marker-end="url(#next)"/>
    <line x1="152" y1="504" x2="192" y2="504" marker-end="url(#next)"/>
    <line x1="304" y1="504" x2="344" y2="504" marker-end="url(#next)"/>
    <line x1="456" y1="504" x2="496" y2="504" marker-end="url(#next)"/>
    <line x1="608" y1="504" x2="648" y2="504" marker-end="url(#next)"/>
  </g>
  <g class="tick">
    <line x1="248" y1="128" x2="248" y2="144"/>
    <line x1="248" y1="328" x2="248" y2="344"/>
    <path d="M400,528 V536 M336,536 H464 M336,536 V544 M464,536 V544"/>
  </g>
  <g class="soft" text-anchor="middle" dominant-baseline="central">
    <text x="400" y="216">Work: each Epic's whole lifecycle</text>
    <text x="400" y="416">Work: each Task's or Bug's whole lifecycle</text>
  </g>

  <g class="card">
    <rect x="40" y="648" width="160" height="64" rx="8"/>
    <rect x="216" y="648" width="160" height="64" rx="8"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="120" y="664" font-size="13" font-weight="600" class="accent">sdlc-capture</text>
    <text x="120" y="680" class="soft">records found work</text>
    <text x="120" y="696" class="soft">under its owner</text>
    <text x="296" y="664" font-size="13" font-weight="600" class="accent">sdlc-hygiene</text>
    <text x="296" y="680" class="soft">sweeps for drift,</text>
    <text x="296" y="696" class="soft">on its trigger</text>

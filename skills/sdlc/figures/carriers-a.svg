<svg xmlns="http://www.w3.org/2000/svg" width="800" height="736" viewBox="0 0 800 736" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" class="ink">
  <title>Each tier's skill and its stages, by gate</title>
  <style>
    .bg { fill: var(--bg, #fff) }
    .ink { fill: var(--ink, #444A5A) }
    .soft { fill: var(--ink, #444A5A); fill-opacity: .8 }
    .muted { fill: var(--muted, #8A90A2) }
    .accent { fill: var(--accent, #3B0E75) }
    .panel { fill: var(--ink, #444A5A); fill-opacity: .05; stroke: var(--muted, #8A90A2); stroke-opacity: .5 }
    .blue { fill: var(--azure, #3D9BD1); fill-opacity: .18; stroke: var(--azure, #3D9BD1) }
    .edge { fill: none; stroke: var(--ink, #444A5A) }
  </style>
  <defs>

    <text x="376" y="120">Design</text>
    <text x="488" y="80">Plan</text>
    <text x="488" y="120">Delegate</text>
    <text x="712" y="80">Close</text>
    <text x="376" y="216">Precheck</text>
    <text x="376" y="256">Design</text>
    <text x="488" y="216">Plan</text>
    <text x="488" y="256">Delegate</text>
    <text x="600" y="216">Review</text>
    <text x="712" y="216">Land</text>
